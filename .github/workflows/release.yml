name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt -r requirements-test.txt

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Verify tag and app versions
        shell: pwsh
        run: |
          $packageVersion = (Get-Content "apps/desktop/package.json" | ConvertFrom-Json).version
          $tauriVersion = (Get-Content "apps/desktop/src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          $expectedTag = "v$packageVersion"
          if ($packageVersion -ne $tauriVersion) { throw "Desktop and Tauri versions differ" }
          if ($expectedTag -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match $expectedTag" }

      - name: Run Python tests
        run: python -m pytest tests/ -q

      - name: Run desktop tests
        working-directory: apps/desktop
        run: npm test

      - name: Build NSIS installer
        working-directory: apps/desktop
        run: npm run installer

      - name: Create updater manifest
        shell: pwsh
        run: |
          $artifact = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip" | Select-Object -First 1
          if (-not $artifact) { throw "Signed updater artifact was not produced" }
          $signaturePath = "$($artifact.FullName).sig"
          if (-not (Test-Path -LiteralPath $signaturePath)) { throw "Updater signature was not produced" }
          $version = (Get-Content "apps/desktop/package.json" | ConvertFrom-Json).version
          $manifest = @{
            version = $version
            notes = (Get-Content "RELEASE_NOTES.md" -Raw)
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = (Get-Content -LiteralPath $signaturePath -Raw).Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($artifact.Name)"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 "latest.json"

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Rynne ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: false
          make_latest: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sha256
            apps/desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip
            apps/desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
            latest.json
